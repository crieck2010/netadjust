[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netadjust"
version = "0.1.0"
description = "Standalone least-squares adjustment for survey networks: weighted parametric adjustment, full statistics, desktop app."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Charles C. Rieck" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["surveying", "least-squares", "geodesy", "network-adjustment", "land-surveying"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
netadjust = "netadjust.cli:main"
netadjust-app = "netadjust.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
